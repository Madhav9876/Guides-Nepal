name: Frontend CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'dashboard/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'dashboard/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install
      - run: npm run lint
      - run: npm run check
      - run: npm run build
