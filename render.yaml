services:
  - type: web
    name: guides-nepal-backend
    env: docker
    region: oregon
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: backend/Dockerfile
    envVars:
      # IMPORTANT: Set DATABASE_URL as a secret in the Render dashboard
      # (Service -> Environment) instead of committing it here, since this
      # repo is public. Use `sync: false` so Render keeps the dashboard value.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: https://guides-nepal-frontend.vercel.app,https://guides-nepal-bi2y.vercel.app,https://guides-nepal-dashboard.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
